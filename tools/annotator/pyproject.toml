[project]
name = "cascade-annotator"
version = "0.1.0"
description = "Local annotation tool for the CASCADE dataset — slim FastAPI server + vendored React frontend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cascade_av",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
]

[project.scripts]
cascade-annotate = "annotator.server.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "annotator"

[tool.uv.sources]
cascade_av = { workspace = true }
