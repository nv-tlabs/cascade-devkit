# Declares how the evaluator launches your system.
#
# At evaluation time your image's added layers are reapplied on the identical
# base and this command runs IN PLACE, on GPU, with the network DISABLED. It must
# read /input and write /output/predictions.jsonl.

# Command to run. Use absolute paths to whatever interpreter/script you baked in.
entrypoint: ["/opt/app/.venv/bin/python", "/opt/app/run.py"]

# Environment variables passed to your entrypoint.
env:
  TOP_K: "100"

# CUDA toolkit line your environment targets (must be compatible with the base's
# CUDA and the evaluation host driver). Informational.
cuda: "13.0"

# Optional free-form note shown to organizers.
notes: "baseline submission"
