# Declares how the evaluator launches your system.
#
# At evaluation time your image's added layers are reapplied on the identical
# base and this command runs IN PLACE, on GPU, with the network DISABLED. It must
# read /input and write /output/predictions.jsonl.

# Command to run. Use absolute paths to whatever interpreter/script you baked in.
entrypoint: ["/opt/app/.venv/bin/python", "/opt/app/run.py"]

# Optional environment variables passed to your entrypoint. Runtime-owned names
# such as TOP_K, INPUT_DIR, and OUTPUT_DIR are supplied by the evaluator and
# must not be overridden here.
env: {}

# Informational description of your framework CUDA runtime and architecture.
# Evaluation uses one NVIDIA A100 80 GB (compute capability 8.0); your wheel and
# compiled extensions must include sm_80 kernels. A runtime version alone is not
# sufficient evidence of compatibility.
cuda: "framework CUDA runtime with sm_80"

# Optional free-form note shown to organizers.
notes: "baseline submission"
