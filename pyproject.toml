[project]
name = "causal_ai_av"
version = "0.1.0"
description = "DevKit for the AV Causal Dataset — causal and spatio-temporal action annotations on top of the Physical AI AV Dataset."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
hf = [
    "physical-ai-av>=0.2.2",
]
annotator = [
    "causal-av-annotator",
]
viz = [
    "pillow>=10.0",
    "plotly>=5.20",
    "ipywidgets>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["tools/annotator"]

[tool.uv.sources]
causal-av-annotator = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.7",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "nbformat>=5.9",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[tool.ruff]
line-length = 100

[tool.uv]
default-groups = "all"
